<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Get Started</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .card {
      width: 92%;
      max-width: 500px;
      background: white;
      padding: 40px 25px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    h1 {
      margin-bottom: 15px;
      font-size: 32px;
    }

    p {
      color: #555;
      font-size: 17px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 40px;
      background: #1877f2;
      color: white;
      text-decoration: none;
      font-size: 19px;
      font-weight: bold;
      border-radius: 10px;
      transition: 0.2s;
    }

    .button:hover {
      transform: scale(1.03);
    }

    .small {
      margin-top: 20px;
      font-size: 13px;
      color: #888;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Get Started Today</h1>

    <p>
      Click the button below to continue.
      Follow the instructions on the next page.
    </p>

    <a
      class="button"
      href="https://singingfiles.com/show.php?l=0&u=2552747&id=75105"
      target="_blank"
      rel="noopener noreferrer">
      GET STARTED
    </a>

    <div class="small">
      Please follow the instructions carefully.
    </div>

  </div>

</body>
</html>
